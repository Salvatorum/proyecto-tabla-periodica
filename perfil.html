<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/pages/perfil.css">
    <link rel="shortcut icon" href="./assets/img/logo01.png" type="image/x-icon">
    <title>Perfil</title>

</head>

<body class="hero">

    <header>
        <nav>
            <ul>
                <li><img id="logo" src="./assets/img/logo01.png" alt="logo"></li>
                <li><a href="./index.html" id="elementos">Elementos</a></li>
                <li><a href="./perfil.html" class="nav-shadow-icon"><img src="./assets/img/perfil.svg" alt="Perfil"></a>
                </li>
                <li><a href="./login.html" class="nav-shadow-icon"><img src="./assets/img/login.svg" alt="Login"></a>
                </li>
            </ul>
        </nav>
    </header>


    <main>
        <div class="contenedor_principal">
            <section class="perfil">
                <img src="assets/img/icono perfil.png">
                <h1>Mi perfil</h1>
                <h3 class="oracion">Gestiona tus datos</h3>

                <form class="formulario_perfil" action="./index.html" method="GET">
                    <input name="nombre" value="Milagros" placeholder="Nombre" type="text" id="nombre" required>
                    <input name="apellido" value="Roggero" placeholder="Apellido" type="text" id="apellido" required>
                    <input name="email" value="milagros@gmail.com" placeholder="Email" type="email" id="email" readonly>
                    <input type="checkbox" id="checkoculto" class="checkoculto">
                    <label for="checkoculto" class="actualizar_perfil-disparador">Actualizar perfil</label>
                    <p id="mensaje">¡Perfil Actualizado!</p>
                    <button type="submit" class="botones">Guardar</button>
                </form>

                <a href="./login.html" class="boton_falso">Cerrar Sesión </a>
            </section>



            <section class=" favoritos">
                <h1>Mis favoritos</h1>
                <h3 class="oracion">Tu lista de elementos esta aqui:</h3>
                <p class="oracion">No agregaste ningún elemento a tus favoritos..</p>
                <a href="./index.html" class="boton_falso">
                    Ver elementos disponibles
                </a>
            </section>
        </div>
    </main>

    <footer>
        <div id="logo-footer">
            <img src="./assets/img/logo01.png" alt="logo">
        </div>
        
        
        <div class="redes">
            <a href="https://github.com/Salvatorum/proyecto-tabla-periodica" target="_blank" aria-label="GitHub"><img src="./assets/img/github.png" alt="github"></a>
            <a href="#" target="_blank" aria-label="LinkedIn"><img src="./assets/img/social.png" alt="LinkedIn"></a>
            <a href="#" target="_blank" aria-label="Instagram"><img src="./assets/img/logotipo-de-instagram.png" alt="Instagram"></a>
        </div>

        <div class="redes caja-ayuda">
            <a href="#">Contáctanos</a>
            <a href="#">Ayuda</a>
            <a href="#">Preguntas Frecuentes</a>
        </div>

        <div id="text-footer">
            <p>&copy; 2026 Tabla Periódica. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>


</html>
