<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/pages/perfil.css">
    <link rel="shortcut icon" href="./assets/img/logo01.png" type="image/x-icon">
    <title>Perfil</title>

</head>

<body class="hero">

    <header>
        <nav>
            <ul>
                <li><img id="logo" src="./assets/img/logo01.png" alt="logo"></li>
                <li><a href="./index.html" id="elementos">Elementos</a></li>
                <li><a href="./perfil.html" class="nav-shadow-icon"><img src="./assets/img/perfil.svg" alt="Perfil"></a>
                </li>
                <li><a href="./login.html" class="nav-shadow-icon"><img src="./assets/img/login.svg" alt="Login"></a>
                </li>
            </ul>
        </nav>
    </header>


    <main>
        <div class="contenedor_principal">
            <section class="perfil">
                <img src="assets/img/icono perfil.png">
                <h1>Mi perfil</h1>
                <h3 class="oracion">Gestiona tus datos</h3>

                <form class="formulario_perfil" id="form" action="" method="POST">
                    <input name="nombre" placeholder="Nombre" type="text" id="nombre">
                    <span id="error-user" class="oracion"></span>
                    <input name="contraseña" placeholder="contraseña" type="password" id="password">
                    <span id="error-password" class="oracion"></span>
                    <input name="email" placeholder="Email" type="email" id="email" readonly>
                    <button type="submit" class="botones">Guardar</button>
                </form>



                <a href="./login.html" class="boton_falso">Cerrar Sesión </a>
            </section>



            <section class=" favoritos" id="contenedor_fav">
                <h1 class="oracion">Mis favoritos</h1>
                <div id="grilla-favoritos"></div>
            </section>
        </div>
    </main>

    <footer>
        <div id="logo-footer">
            <img src="./assets/img/logo01.png" alt="logo">
        </div>

        <nav aria-label="Redes sociales" class="nav-redes">
            <ul>
                <li>
                    <a href="https://github.com/Salvatorum/proyecto-tabla-periodica" target="_blank"
                        aria-label="GitHub">
                        <img src="./assets/img/github.png" alt="">
                    </a>
                </li>
                <li>
                    <a href="#" target="_blank" aria-label="LinkedIn">
                        <img src="./assets/img/social.png" alt="">
                    </a>
                </li>
                <li>
                    <a href="#" target="_blank" aria-label="Instagram">
                        <img src="./assets/img/logotipo-de-instagram.png" alt="">
                    </a>
                </li>
            </ul>
        </nav>

        <nav aria-label="Enlaces de ayuda" class="nav-ayuda">
            <ul>
                <li><a href="#">Contáctanos</a></li>
                <li><a href="#">Ayuda</a></li>
                <li><a href="#">Preguntas frecuentes</a></li>
            </ul>
        </nav>

        <div id="text-footer">
            <p>&copy; 2026 Tabla Periódica. Todos los derechos reservados.</p>
        </div>
    </footer>


    <script type="module" src="./js/pages/perfil.js"></script>
</body>


</html>
