<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/pages/perfil.css">
    <link rel="shortcut icon" href="./assets/img/logo01.png" type="image/x-icon">
    <title>Perfil</title>

</head>

<body class="hero">

    <header id="main-header">
        
    </header>


    <main>
        <div class="contenedor_principal">
            <section class="perfil">
                <img src="assets/img/icono perfil.png">
                <h1>Mi perfil</h1>
                <h3 class="oracion">Gestiona tus datos</h3>

                <form class="formulario_perfil" id="form" action="" method="POST">
                    <input name="nombre" placeholder="Nombre" type="text" id="nombre">
                    <span id="error-user" class="oracion"></span>
                    <input name="contraseña" placeholder="contraseña" type="password" id="password">
                    <span id="error-password" class="oracion"></span>
                    <input name="email" placeholder="Email" type="email" id="email" readonly>
                    <button type="submit" class="botones">Guardar</button>
                </form>



                <button type="button" class="botones" id="cerrar-sesion">Cerrar sesion</button>
            </section>



            <section class=" favoritos" id="contenedor_fav">
                <h1 class="oracion">Mis favoritos</h1>
                <div id="grilla-favoritos"></div>
            </section>
        </div>
    </main>

    <footer id="main-footer">
        
    </footer>


    <script type="module" src="./js/pages/perfil.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>


</html>
