<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Contraseña</title>

   <link rel="stylesheet" href="./css/global.css">

    <link rel="stylesheet" href="./css/animations.css">

    <link rel="stylesheet" href="./css/pages/ForgetPass.css">

    <link rel="stylesheet" href="./css/components.css">

</head>

<body class="hero">

   <header id="main-header">
       
    </header>


    <main>

        <section class="contenedor-login">

            <h1>Recuperar Contraseña</h1>
            <p>Ingresá tu correo electrónico</p>

            <!-- Agregamos ID y novalidate -->
            <form id="form-forget-pass" novalidate>

                <!-- Le agregamos un ID al input para leerlo desde JS -->
                <input type="email" id="forget-email" placeholder="Correo electrónico" required>

                <!-- CAMBIO CLAVE: Cambiamos la etiqueta <a> por un <button> de tipo submit -->
                <button type="submit" class="boton-login">
                    Enviar
                </button>

            </form>

            <div class="links">
                <a href="./login.html">
                    Volver al Login
                </a>
            </div>

        </section>

    </main>

    <footer id="main-footer">
       
    </footer>

    <script type="module" src="./js/app.js"></script>
    <script src="./js/pages/forgetPass.js"></script>
</body>

</html>
